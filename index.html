<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مشروع التخرج - AI Civil</title>

<style>
body {
    font-family: Arial;
    direction: rtl;
    background: #0f172a;
    color: white;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

input {
    padding: 10px;
    margin: 5px;
    width: 200px;
}

button {
    padding: 10px 20px;
    margin: 10px;
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
}

.card {
    background: #1e293b;
    padding: 20px;
    margin: 15px;
    border-radius: 10px;
}

.hidden { display:none; }

img {
    width: 100%;
    border-radius: 10px;
}
</style>

</head>
<body>

<div class="container">

<!-- LOGIN -->
<div id="login">
<h2>تسجيل الدخول</h2>
<input id="user" placeholder="اسم المستخدم"><br>
<input id="pass" type="password" placeholder="كلمة المرور"><br>
<button onclick="login()">دخول</button>
<p id="error"></p>
</div>

<!-- MAIN -->
<div id="main" class="hidden">
<h1>مشروع الذكاء الاصطناعي</h1>

<button onclick="showSection('programs')">البرامج</button>
<button onclick="showSection('quiz')">بنك الأسئلة</button>

<!-- PROGRAMS -->
<div id="programs" class="hidden">

<div class="card">
<h3>SAP2000</h3>
<img src="sap2000.jpg">
<p>برنامج تحليل وتصميم إنشائي</p>
<a href="#">تحميل</a>
</div>

<div class="card">
<h3>ETABS</h3>
<img src="etabs.jpg">
<p>برنامج تصميم المباني</p>
<a href="#">تحميل</a>
</div>

<div class="card">
<h3>SAFE</h3>
<img src="safe.jpg">
<p>برنامج تصميم الأساسات</p>
<a href="#">تحميل</a>
</div>

</div>

<!-- QUIZ -->
<div id="quiz" class="hidden">
<h2>بنك الأسئلة</h2>

<div id="questionBox"></div>

<button onclick="next()">التالي</button>
<button onclick="finish()">إنهاء</button>

<p id="score"></p>
</div>

</div>

</div>

<script>

// LOGIN
function login(){
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;

    if(u === "admin" && p === "1234"){
        document.getElementById("login").classList.add("hidden");
        document.getElementById("main").classList.remove("hidden");
    } else {
        document.getElementById("error").innerText = "خطأ في البيانات";
    }
}

// NAVIGATION
function showSection(id){
    document.getElementById("programs").classList.add("hidden");
    document.getElementById("quiz").classList.add("hidden");

    document.getElementById(id).classList.remove("hidden");

    if(id === "quiz") loadQuestion();
}

// QUESTIONS (200 سؤال بدون تكرار)
let questions = [];

for(let i=1;i<=200;i++){
    questions.push({
        q: "سؤال رقم " + i,
        a: ["A","B","C","D"],
        correct: "A"
    });
}

let index = 0;
let score = 0;

function loadQuestion(){
    let q = questions[index];
    let html = "<h3>"+q.q+"</h3>";

    q.a.forEach(ans=>{
        html += `<button onclick="answer('${ans}')">${ans}</button>`;
    });

    document.getElementById("questionBox").innerHTML = html;
}

function answer(ans){
    if(ans === questions[index].correct){
        score++;
    }
    index++;
    if(index < questions.length){
        loadQuestion();
    } else {
        finish();
    }
}

function next(){
    index++;
    loadQuestion();
}

function finish(){
    document.getElementById("score").innerText =
    "نتيجتك: " + score + " / " + questions.length;
}

</script>

</body>
</html>
