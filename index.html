<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مشروع التخرج</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  width:220px;
}

.card img{
  width:100%;
  height:120px;
  object-fit:contain;
}

button{
  margin:5px;
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<h1>البرامج الهندسية</h1>

<div class="container">

<!-- SAP -->
<div class="card">
<h3>SAP2000</h3>
<img src="sap2000.jpg">
<p>تحليل وتصميم المنشآت</p>

<a href="https://www.csiamerica.com/products/sap2000" target="_blank">
<button>تحميل البرنامج</button>
</a>

<button onclick="openQuiz('sap')">بنك الأسئلة</button>
</div>

<!-- AutoCAD -->
<div class="card">
<h3>AutoCAD</h3>
<img src="autocad.jpg">
<p>الرسم الهندسي</p>

<a href="https://www.autodesk.com/products/autocad" target="_blank">
<button>تحميل البرنامج</button>
</a>

<button onclick="openQuiz('autocad')">بنك الأسئلة</button>
</div>

<!-- Revit -->
<div class="card">
<h3>Revit</h3>
<img src="revit.jpg">
<p>نمذجة BIM</p>

<a href="https://www.autodesk.com/products/revit" target="_blank">
<button>تحميل البرنامج</button>
</a>

<button onclick="openQuiz('revit')">بنك الأسئلة</button>
</div>

<!-- Civil 3D -->
<div class="card">
<h3>Civil 3D</h3>
<img src="civil3d.jpg">
<p>تصميم الطرق</p>

<a href="https://www.autodesk.com/products/civil-3d" target="_blank">
<button>تحميل البرنامج</button>
</a>

<button onclick="openQuiz('civil')">بنك الأسئلة</button>
</div>

</div>

<!-- قسم الأسئلة -->
<div id="quizSection" class="hidden">
<h2>بنك الأسئلة</h2>
<div id="questionBox"></div>
<br>
<button onclick="closeQuiz()">رجوع</button>
</div>

<script>

// فتح الأسئلة
function openQuiz(type){

  document.getElementById("quizSection").classList.remove("hidden");

  let questions = [];

  if(type==="sap"){
    questions = [
      {q:"ما وظيفة SAP2000؟",a:["تحليل إنشائي","رسم","برمجة"],c:0},
      {q:"طريقة التحليل؟",a:["FEM","GIS","Excel"],c:0},
      {q:"العنصر للكمرات؟",a:["Frame","Shell","Solid"],c:0}
    ];
  }

  if(type==="autocad"){
    questions = [
      {q:"وظيفة AutoCAD؟",a:["رسم","تحليل","برمجة"],c:0},
      {q:"اختصار Line؟",a:["L","C","X"],c:0}
    ];
  }

  if(type==="revit"){
    questions = [
      {q:"Revit يستخدم في؟",a:["BIM","رسم","تحليل"],c:0}
    ];
  }

  if(type==="civil"){
    questions = [
      {q:"Civil 3D يستخدم في؟",a:["الطرق","الرسم","البرمجة"],c:0}
    ];
  }

  showQuestions(questions);
}

// عرض الأسئلة
function showQuestions(qs){

  let html="";

  qs.forEach((q,i)=>{
    html += `<h3>سؤال ${i+1}</h3><p>${q.q}</p>`;
    q.a.forEach(ans=>{
      html += `<button>${ans}</button>`;
    });
  });

  document.getElementById("questionBox").innerHTML = html;
}

// رجوع
function closeQuiz(){
  document.getElementById("quizSection").classList.add("hidden");
}

</script>

</body>
</html>
