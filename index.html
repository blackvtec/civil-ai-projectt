<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مشروع التخرج</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔐 تسجيل الدخول -->
<div id="loginBox">
    <h2>تسجيل الدخول</h2>
    <input id="username" placeholder="اسم المستخدم"><br><br>
    <input id="password" type="password" placeholder="كلمة المرور"><br><br>
    <button onclick="login()">دخول</button>
</div>

<!-- 🟢 الموقع بعد الدخول -->
<div id="main" class="hidden">

    <h1>مشروع الذكاء الاصطناعي في الهندسة المدنية</h1>

    <button onclick="showQuiz()">ابدأ الاختبار</button>
    <button onclick="showBank()">📚 بنك الأسئلة</button>

    <div id="quiz"></div>
    <div id="bank"></div>

</div>

<script src="script.js"></script>
</body>
</html>
