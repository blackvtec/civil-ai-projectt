<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مشروع التخرج - البرامج الهندسية</title>

<style>
body{
    font-family: Arial;
    margin:0;
    background:#0f172a;
    color:white;
    text-align:center;
}

.hidden{display:none;}

h1{margin:20px;}

.container{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:15px;
    width:220px;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:120px;
    object-fit:contain;
}

button{
    display:block;
    margin:10px auto;
    padding:10px;
    width:200px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#38bdf8;
}

#loginBox{
    margin-top:100px;
}

input{
    display:block;
    margin:10px auto;
    padding:10px;
    width:200px;
}
</style>
</head>

<body>

<!-- تسجيل الدخول -->
<div id="loginBox">
<h1>تسجيل الدخول</h1>
<input id="username" placeholder="username">
<input id="password" placeholder="password" type="password">
<button onclick="login()">دخول</button>
<p id="error"></p>
</div>

<!-- الصفحة الرئيسية -->
<div id="main" class="hidden">
<h1>البرامج الهندسية</h1>

<div id="programs" class="container">

<div class="card" onclick="startProgramQuiz('sap')">
<h3>SAP2000</h3>
<img src="sap2000.jpg">
<p>تحليل وتصميم المنشآت</p>
</div>

<div class="card" onclick="startProgramQuiz('autocad')">
<h3>AutoCAD</h3>
<img src="autocad.jpg">
<p>الرسم الهندسي</p>
</div>

<div class="card" onclick="startProgramQuiz('revit')">
<h3>Revit</h3>
<img src="revit.jpg">
<p>نمذجة BIM</p>
</div>

<div class="card" onclick="startProgramQuiz('civil')">
<h3>Civil 3D</h3>
<img src="civil3d.jpg">
<p>تصميم الطرق</p>
</div>

</div>

<!-- الاختبار -->
<div id="quiz" class="hidden">
<h2>بنك الأسئلة</h2>
<div id="questionBox"></div>
<p id="result"></p>
<button onclick="goBack()">رجوع</button>
</div>

</div>

<script>
// ================= تسجيل الدخول =================
function login(){
    let u = document.getElementById("username").value;
    let p = document.getElementById("password").value;

    if(u==="admin" && p==="1234"){
        document.getElementById("loginBox").style.display="none";
        document.getElementById("main").classList.remove("hidden");
    }else{
        document.getElementById("error").innerText="❌ خطأ";
    }
}

// ================= الأسئلة =================
let sapQuestions = [
{q:"وظيفة SAP2000؟",a:["رسم","تحليل إنشائي","برمجة","مونتاج"],c:1},
{q:"طريقة التحليل؟",a:["FEM","GIS","Excel","Word"],c:0},
{q:"العنصر للكمرات؟",a:["Frame","Shell","Solid","Cable"],c:0},
{q:"العقد؟",a:["Joint","Node","Axis","Grid"],c:0},
{q:"تشغيل التحليل؟",a:["Run Analysis","Draw","Assign","Define"],c:0}
];

let autocadQuestions = [
{q:"وظيفة AutoCAD؟",a:["تحليل","رسم","برمجة","إدارة"],c:1},
{q:"Line؟",a:["L","C","X","M"],c:0},
{q:"Circle؟",a:["C","D","O","R"],c:0},
{q:"Erase؟",a:["حذف","نسخ","تحريك","قص"],c:0},
{q:"Copy؟",a:["نسخ","تحريك","حذف","تدوير"],c:0}
];

let revitQuestions = [
{q:"Revit يستخدم في؟",a:["BIM","رسم","تحليل","برمجة"],c:0},
{q:"BIM؟",a:["نمذجة المباني","تحليل","رسم","برمجة"],c:0},
{q:"Wall؟",a:["جدار","باب","سقف","محور"],c:0},
{q:"Door؟",a:["باب","جدار","سقف","محور"],c:0},
{q:"3D View؟",a:["عرض ثلاثي","تحليل","رسم","كود"],c:0}
];

let civilQuestions = [
{q:"Civil 3D؟",a:["طرق","برمجة","رسم","تحليل"],c:0},
{q:"Corridor؟",a:["طريق","جدار","كمرة","بلاطة"],c:0},
{q:"Surface؟",a:["سطح","جدار","محور","كمرة"],c:0},
{q:"Alignment؟",a:["مسار","جدار","كمرة","بلاطة"],c:0},
{q:"Profile؟",a:["مقطع طولي","عرضي","جدار","كمرة"],c:0}
];

// ================= التحكم =================
let questions=[];
let index=0;
let score=0;

// بدء اختبار
function startProgramQuiz(type){

    if(type==="sap") questions=sapQuestions;
    if(type==="autocad") questions=autocadQuestions;
    if(type==="revit") questions=revitQuestions;
    if(type==="civil") questions=civilQuestions;

    document.getElementById("programs").classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");

    index=0;
    score=0;

    loadQuestion();
}

// عرض سؤال
function loadQuestion(){

    if(index>=questions.length){
        showResult();
        return;
    }

    let q=questions[index];

    let html=`
    <h3>سؤال ${index+1} من ${questions.length}</h3>
    <p>${q.q}</p>
    `;

    q.a.forEach((ans,i)=>{
        html+=`<button onclick="answer(${i})">${ans}</button>`;
    });

    document.getElementById("questionBox").innerHTML=html;
}

// إجابة
function answer(i){
    if(i===questions[index].c) score++;
    index++;
    loadQuestion();
}

// النتيجة
function showResult(){

    let level="";

    if(score===questions.length) level="🔥 فل مارك";
    else if(score>questions.length/2) level="👍 جيد";
    else level="⚠️ راجع";

    document.getElementById("questionBox").innerHTML="";
    document.getElementById("result").innerText=
    "نتيجتك: "+score+"/"+questions.length+" - "+level;
}

// رجوع
function goBack(){
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("programs").classList.remove("hidden");
}
</script>

</body>
</html>
