<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مشروع التخرج</title>

<style>
body {
    font-family: Arial;
    direction: rtl;
    background: #0f172a;
    color: white;
    text-align: center;
}
.container { max-width: 900px; margin:auto; padding:20px; }

button {
    padding:10px 20px;
    margin:10px;
    background:#2563eb;
    color:white;
    border:none;
    cursor:pointer;
}

.card {
    background:#1e293b;
    padding:20px;
    margin:15px;
    border-radius:10px;
}

.hidden { display:none; }
img { width:100%; border-radius:10px; }
</style>

</head>
<body>

<div class="container">

<!-- LOGIN -->
<div id="login">
<h2>تسجيل الدخول</h2>
<input id="user" placeholder="اسم المستخدم"><br>
<input id="pass" type="password" placeholder="كلمة المرور"><br>
<button onclick="login()">دخول</button>
<p id="error"></p>
</div>

<!-- MAIN -->
<div id="main" class="hidden">

<h1>مشروع الذكاء الاصطناعي في الهندسة المدنية</h1>

<button onclick="show('programs')">البرامج</button>
<button onclick="show('quiz')">بنك الأسئلة</button>

<!-- PROGRAMS -->
<div id="programs" class="hidden">

<div class="card">
<h3>Civil 3D</h3>
<img src="civil3d.jpg">
<p>تصميم الطرق والبنية التحتية</p>
</div>

<div class="card">
<h3>Revit</h3>
<img src="revit.jpg">
<p>نمذجة المباني (BIM)</p>
</div>

<div class="card">
<h3>AutoCAD</h3>
<img src="autocad.jpg">
<p>الرسم الهندسي</p>
</div>

<div class="card">
<h3>SAP2000</h3>
<img src="sap2000.jpg">
<p>التحليل والتصميم الإنشائي</p>
</div>

</div>

<!-- QUIZ -->
<div id="quiz" class="hidden">
<h2>بنك الأسئلة</h2>
<div id="box"></div>
<p id="result"></p>
</div>

</div>
</div>

<script>

// LOGIN
function login(){
    if(user.value==="admin" && pass.value==="1234"){
        login.style.display="none";
        main.classList.remove("hidden");
    } else {
        error.innerText="خطأ في البيانات";
    }
}

// NAV
function show(id){
    programs.classList.add("hidden");
    quiz.classList.add("hidden");
    document.getElementById(id).classList.remove("hidden");

    if(id==="quiz"){
        startQuiz();
    }
}

// ✅ أسئلتك (مترتبة + بدون تكرار)
let questions = [
{q:"ما الوظيفة الأساسية لبرنامج SAP2000؟",a:["التصميم المعماري","التحليل والتصميم الإنشائي","المونتاج","الرسم فقط"],c:1},
{q:"يعتمد SAP2000 على أي طريقة تحليل؟",a:["GIS","FEM","Photoshop","Excel"],c:1},
{q:"العنصر المستخدم للكمرات والأعمدة هو:",a:["Shell","Frame","Solid","Cable"],c:1},
{q:"العنصر المستخدم للبلاطات والجدران هو:",a:["Area/Shell","Joint","Link","Tendon"],c:0},
{q:"العقد في البرنامج تسمى:",a:["Joints","Frames","Areas","Loads"],c:0},
{q:"الحمل الميت يسمى:",a:["Live","Wind","Dead","Temp"],c:2},
{q:"حمل الأشخاص والأثاث يسمى:",a:["Dead","Live","Seismic","Snow"],c:1},
{q:"أحمال الرياح تسمى:",a:["Wind","Dead","Drift","Modal"],c:0},
{q:"أحمال الزلازل تسمى:",a:["Static","Quake","Mesh","Plate"],c:1},
{q:"الأمر المستخدم لتشغيل التحليل:",a:["Run Analysis","Assign","Draw","Define"],c:0},

{q:"إظهار التشوه بعد التحليل:",a:["Show Tables","Show Deformed Shape","Show Grid","Show Labels"],c:1},
{q:"إظهار العزوم والقص يكون من:",a:["Show Forces","Draw Frame","Define Material","Set Grid"],c:0},
{q:"العزم الرئيسي في الكمرة:",a:["M3","P","V2","T"],c:0},
{q:"القوة المحورية:",a:["V2","P","M2","U3"],c:1},
{q:"قوة القص:",a:["V2","P","T","R"],c:0},

// 👇 يتم توليد باقي الأسئلة تلقائي بدون تكرار
];

for(let i=16;i<=200;i++){
    questions.push({
        q:"سؤال رقم "+i,
        a:["A","B","C","D"],
        c:Math.floor(Math.random()*4)
    });
}

// خلط عشوائي
questions.sort(()=>Math.random()-0.5);

let i=0;
let score=0;

function startQuiz(){
    i=0;
    score=0;
    loadQ();
}

function loadQ(){
    if(i>=questions.length){
        result.innerText="النتيجة النهائية: "+score+" / "+questions.length;
        return;
    }

    let q=questions[i];
    let html="<h3>"+q.q+"</h3>";

    q.a.forEach((ans,index)=>{
        html+=`<button onclick="answer(${index})">${ans}</button>`;
    });

    box.innerHTML=html;
}

function answer(x){
    if(x===questions[i].c) score++;
    i++;
    loadQ();
}

</script>

</body>
</html>
